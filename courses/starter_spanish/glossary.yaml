- word: "Hola"
  translation: "Hello / Hi"
  part_of_speech: "interjection"
  example_sentence: "Hola, ¿cómo estás?"
  notes: "Universal informal greeting."

- word: "Adiós"
  translation: "Goodbye"
  part_of_speech: "interjection"
  example_sentence: "Adiós, ¡hasta luego!"
  notes: "Standard farewell."

- word: "Gracias"
  translation: "Thank you / Thanks"
  part_of_speech: "interjection"
  example_sentence: "Muchas gracias por tu ayuda."
  notes: "Expresses gratitude."

- word: "Por favor"
  translation: "Please"
  part_of_speech: "phrase"
  example_sentence: "¿Un café, por favor?"
  notes: "Polite request formula."

- word: "Buenos días"
  translation: "Good morning"
  part_of_speech: "phrase"
  example_sentence: "Buenos días a todos."
  notes: "Used in the morning until midday."

- word: "Buenas noches"
  translation: "Good evening / Good night"
  part_of_speech: "phrase"
  example_sentence: "Buenas noches, que descanses."
  notes: "Used both as greeting in the evening and when parting at night."

- word: "Sí"
  translation: "Yes"
  part_of_speech: "adverb"
  example_sentence: "Sí, hablo un poco de español."
  notes: "Affirmation."

- word: "No"
  translation: "No / Not"
  part_of_speech: "adverb"
  example_sentence: "No, no lo sé."
  notes: "Negation."
