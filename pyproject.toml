[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "language-learning-app"
version = "1.0.0"
description = "A desktop language learning application built with PySide6"
authors = [{ name = "Language Learning App Contributors" }]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function call in argument defaults
    "B905", # zip without explicit strict parameter
    "UP042", # StrEnum inherits str, Enum for Python 3.10 compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["application"]
